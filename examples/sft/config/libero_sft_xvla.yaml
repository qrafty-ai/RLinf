# XVLA SFT Configuration for LIBERO Dataset
#
# This config enables supervised fine-tuning of XVLA models on LIBERO demonstrations.
# XVLA is a flow-matching VLA model with Florence2 backbone.
#
# Usage:
#   python examples/sft/train_vla_sft.py --config-name libero_sft_xvla
#
# Prerequisites:
#   1. Install XVLA dependencies: bash requirements/install.sh embodied --model xvla --env libero
#   2. Download LIBERO dataset in LeRobot format
#   3. Update data.train_data_paths with your dataset path

defaults:
  - model/xvla@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/
    - file://${oc.env:EMBODIED_PATH}/../embodiment/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "xvla_libero_sft"
    logger_backends: ["tensorboard"]

  max_epochs: 30000
  max_steps: -1
  val_check_interval: -1
  save_interval: 2000

data:
  train_data_paths: "/home/cc/codes/RLinf/datasets/libero_10"
  num_workers: 4

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 128
  seed: 0

  model:
    precision: "bf16"
    model_path: "lerobot/xvla-libero"
    num_action_chunks: 30
    action_dim: 7

    xvla:
      config_name: "xvla_libero"
      domain_id: 3
      adapter:
        simulator: "libero"

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    warmup_style: "cosine"
    lr_warmup_steps: 1000
    total_training_steps: 30000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
